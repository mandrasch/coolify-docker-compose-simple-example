server {
    listen 80;  # Listen on port 80 (HTTP)

    # TODO: use FQDN dynamically from Coolify env vars here - how?
    #  wildcard, respond to all request
    server_name _; 

    root /usr/share/nginx/html;  # The directory where your HTML files are located
    index index.html;  # Default file to serve

    # Location block for serving static files
    location / {
        try_files $uri $uri/ =404;  # Try to serve the file, otherwise return a 404
    }

    # Optional: Static file caching (for performance)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|ttf|woff|woff2)$ {
        expires 30d;  # Cache static files for 30 days
        access_log off;  # Disable logging for static files
    }

    # Optional: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}